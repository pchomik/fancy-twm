name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        variant: [windows10, windows11]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --no-default-features --features ${{ matrix.variant }}

      - name: Package
        shell: pwsh
        run: |
          $archive = "tilo-${{ github.ref_name }}-${{ matrix.variant }}.zip"
          Compress-Archive -Path target/release/tilosrv.exe, target/release/tiloctl.exe -DestinationPath $archive

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: tilo-${{ github.ref_name }}-${{ matrix.variant }}.zip
